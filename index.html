<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ff6b00" />
    <meta name="description" content="Verse: piccoli passi per capire la tua alimentazione." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Verse" />
    <script>
      (() => {
        const parameters = new URLSearchParams(window.location.search);
        const personal = parameters.get("demo") === "tracker";
        const manifest = document.createElement("link");
        manifest.rel = "manifest";
        manifest.href = personal ? "./manifest-personal.webmanifest" : "./manifest-fitactive.webmanifest";
        document.head.append(manifest);
        if (personal) {
          document.querySelector('meta[name="apple-mobile-web-app-title"]')?.setAttribute("content", "Verse Mio");
          document.title = "Verse Mio";
        } else if (parameters.get("demo") === "fitactive") {
          document.querySelector('meta[name="apple-mobile-web-app-title"]')?.setAttribute("content", "Verse Demo");
          document.title = "Verse Demo FitActive";
        }
      })();
    </script>
    <link rel="icon" href="/verse-demo/icons/verse-mark.svg" />
    <link rel="apple-touch-icon" href="/verse-demo/icons/verse-icon-192.png" />
    <title>Verse</title>
    <script type="module" crossorigin src="/verse-demo/assets/index-DMBt3jI8.js"></script>
    <link rel="modulepreload" crossorigin href="/verse-demo/assets/preload-helper-BRza7kvk.js">
    <link rel="stylesheet" crossorigin href="/verse-demo/assets/index-CLwD_F60.css">
  </head>

  </body>
</html>
